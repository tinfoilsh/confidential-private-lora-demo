cvm-version: 0.11.1
cpus: 16
memory: 65536
gpus: 1

# Customer-run keyserver that releases the adapter decryption key to the
# attested enclave at boot. Measured into the enclave attestation.
keyserver-url: https://keys.tanyaverma.sh:9443

networks:
  nvidia:
    egress: allowlist
    allow:
      - edge.urm.nvidia.com
      - openaipublic.blob.core.windows.net

models:
  # Public base weights: plaintext dm-verity model pack pinned to an exact
  # Hugging Face commit.
  - name: "gpt-oss-20b"
    repo: "openai/gpt-oss-20b@6cee5e81ee83917806bbde320786a8fb61efebee"
    mpk: "fa8945a2fd0ffe7ddfd31b5da869e2c7c045c971e0230e2fd500fc125315f0bf_41301471232_8b6516c9-adf7-5235-a86a-f135dba359c1"

  # Private LoRA fine-tune: encrypted model pack (dm-crypt under dm-verity).
  # The host only ever holds ciphertext; the enclave fetches LORA_MODEL_KEY
  # from the keyserver above after presenting fresh attestation evidence.
  - name: "text2sql-adapter"
    repo: "tinfoilsh/private-text2sql-lora@011984a1eee853ddd001d5b935f050a787f5401e0a6c23eaf2324db1a347c169"
    emwp: "c52eb009b39b6d31b332cb48b3584626bd2e4035fb455446ba6edf77c63ec2cb_182267904_3191a26c-159f-5251-ac05-a68cf61cabbb"
    key-secret: LORA_MODEL_KEY

containers:
  - name: "gpt-oss-20b-lora"
    image: "vllm/vllm-openai:v0.27.0-ubuntu2404@sha256:ad9c99bccd0a106a9b76817dadd56ad7813a662a929b472ce35bdaa71396ed06"
    runtime: nvidia
    gpus: all
    restart: always
    models: [text2sql-adapter]
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-fa8945a2fd0ffe7ddfd31b5da869e2c7c045c971e0230e2fd500fc125315f0bf",
        "--served-model-name",
        "gpt-oss-20b",
        "--enable-lora",
        "--max-loras",
        "4",
        "--max-lora-rank",
        "8",
        "--lora-modules",
        "gpt-oss-20b-text2sql=/tinfoil/models/text2sql-adapter",
        "--enable-auto-tool-choice",
        "--tool-call-parser",
        "openai",
        "--gpu-memory-utilization",
        "0.90",
        "--port",
        "8001",
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=4g,mode=0700,exec
      /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins: size=2g,mode=1777,exec
    networks: ["nvidia"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 30m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/completions
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/completions
    - /v1/models
    - /health
    - /metrics
